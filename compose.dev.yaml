services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: convoassist
      POSTGRES_PASSWORD: convoassist
      POSTGRES_DB: convoassist
    ports:
      - "5432:5432"
    volumes:
      - convoassist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoassist -d convoassist"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: convoassist
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  convoassist_pgdata:
